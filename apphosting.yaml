# Firebase App Hosting configuration for FluentLoop Reading (Next.js App Router)
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
  - variable: GEMINI_GRADING_MODEL
    value: gemini-3-flash-preview
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://ais-pre-m5smnqvfyxyrlvrkl76egf-965456113659.europe-west2.run.app
    availability:
      - BUILD
      - RUNTIME
