# Firebase App Hosting configuration for FluentLoop Reading (Next.js App Router)
runConfig:
  minInstances: 0
  maxInstances: 3
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
  - variable: PLACEMENT_GUEST_SECRET
    secret: PLACEMENT_GUEST_SECRET
    availability:
      - RUNTIME
  - variable: GEMINI_GRADING_MODEL
    value: gemini-3-flash-preview
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://fluentloop.space
    availability:
      - BUILD
      - RUNTIME
  - variable: APP_URL
    value: https://fluentloop.space
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_GA_MEASUREMENT_ID
    value: G-K0HK3NPE7K
    availability:
      - BUILD
      - RUNTIME
